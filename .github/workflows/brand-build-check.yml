name: Brand refresh build check

on:
  push:
    branches:
      - design/bright-yellow-deep-green
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: greens-delight-preview
          path: .output
          if-no-files-found: error
          retention-days: 1
